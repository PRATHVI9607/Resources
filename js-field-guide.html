*, *::before, *::after { box-sizing: border-box; }

  width: 36px; height: 36px; display: grid; place-items: center;

}

}

.main { min-width: 0; padding: var(--s6) var(--s6) var(--s7); }

/* ---------- toc ---------- */
.toc { position: sticky; top: calc(var(--header-h) + var(--s6)); align-self: start; max-height: calc(100vh - var(--header-h) - 4rem); overflow-y: auto; font-size: 0.84rem; }

.toc a { display: block; padding: 0.3rem 0 0.3rem var(--s3); margin-left: -1px; border-left: 1px solid transparent; color: var(--faint); text-decoration: none; line-height: 1.35; }
.toc a:hover { color: var(--text); }

/* ---------- typography ---------- */

.badge { font-size: 0.72rem; font-weight: 500; letter-spacing: 0; padding: 0.1rem 0.45rem; border-radius: 3px; border: 1px solid; vertical-align: middle; white-space: nowrap; }
.b-work { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.b-ref { color: var(--faint); border-color: var(--border-strong); }

.prose-list, .steps { padding-left: 1.3rem; margin: 0 0 var(--s4); }

.steps { counter-reset: s; list-style: none; padding-left: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 1.8rem 1fr; gap: var(--s2); }
.steps li::before { content: counter(s); font-family: var(--mono); font-size: 0.8rem; color: var(--accent); width: 1.5rem; height: 1.5rem; border: 1px solid var(--accent); border-radius: 50%; display: grid; place-items: center; margin-top: 0.1rem; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 0 0 var(--s5); border: 1px solid var(--border); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; color: var(--muted); background: var(--surface); font-size: 0.85rem; }

td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.roadmap tfoot td { font-weight: 600; border-top: 1px solid var(--border-strong); background: var(--surface); }

/* ---------- code blocks ---------- */
.code-block { margin: 0 0 var(--s5); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--code-bg); overflow: hidden; }
.code-block.flat { margin: 0; border-radius: var(--r); }
.cb-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0.4rem 0.5rem 0.4rem var(--s4); border-bottom: 1px solid var(--border); background: var(--surface); min-height: 42px; }
.cb-title { font-size: 0.86rem; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
.cb-tools { display: flex; align-items: center; gap: var(--s2); flex-shrink: 0; }
.env { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--faint); white-space: nowrap; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 0.35rem;
  height: 30px; padding: 0 0.6rem;
  font: 500 0.78rem var(--font); color: var(--muted);
  background: transparent; border: 1px solid var(--border); border-radius: var(--r);
  cursor: pointer;
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-strong); background: var(--raised); }
.btn-ghost.copied { color: var(--ok); border-color: var(--ok); }
.btn-ghost.copy-failed { color: var(--err); border-color: var(--err); }
.pre { margin: 0; padding: var(--s4) 0; overflow-x: auto; font-size: 0.875rem; line-height: 1.6; tab-size: 2; }
.pre code { display: block; min-width: max-content; }
.ln { display: block; padding: 0 var(--s4); white-space: pre; }
.pre.numbered { counter-reset: ln; }
.pre.numbered .ln { counter-increment: ln; padding-left: 0; }
.pre.numbered .ln::before { content: counter(ln); display: inline-block; width: 2.8rem; padding-right: var(--s4); text-align: right; color: var(--faint); opacity: 0.6; user-select: none; }
.ln.hl { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--warn); }
.t-kw { color: var(--t-kw); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; } .t-fn { color: var(--t-fn); } .t-lit { color: var(--t-lit); }
.t-tag { color: var(--t-tag); } .t-attr { color: var(--t-attr); } .t-op { color: var(--t-op); }
.cb-explain { padding: var(--s3) var(--s4); margin: 0; font-size: 0.92rem; color: var(--muted); border-top: 1px solid var(--border); background: var(--surface); }

.output { border-top: 1px solid var(--border); }

.out-error .out-head { color: var(--err); }

.out-line .icon { position: relative; top: 0.12em; }
.out-line.warn { color: var(--warn); background: var(--warn-soft); }
.out-line.err { color: var(--err); background: var(--err-soft); }
.out-text { font-family: var(--font); font-size: 0.92rem; padding: 0.1rem var(--s4); margin: 0; }
.out-table-wrap { padding: var(--s2) var(--s4); overflow-x: auto; }
.out-table { width: auto; font-size: 0.82rem; border: 1px solid var(--border); }
.out-table th, .out-table td { padding: 0.2rem 0.8rem; border: 1px solid var(--border); }

.line-notes-label { margin: 0; padding: var(--s3) var(--s4) 0; font-size: 0.8rem; color: var(--faint); border-top: 1px solid var(--border); background: var(--surface); }
.line-notes { margin: 0; padding: var(--s3) var(--s4); background: var(--surface); border-top: 1px solid var(--border); font-size: 0.9rem; }
.line-notes-label + .line-notes { border-top: 0; padding-top: var(--s2); }
.line-notes div { display: grid; grid-template-columns: 4.2rem 1fr; gap: var(--s3); padding: 0.2rem 0; }
.line-notes dt { font-family: var(--mono); font-size: 0.78rem; color: var(--accent); padding-top: 0.15rem; }
.line-notes dd { margin: 0; color: var(--muted); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 var(--s2); overflow-x: auto; }
.tabs [role="tab"] { font: 500 0.8rem var(--mono); color: var(--faint); background: none; border: 0; border-bottom: 2px solid transparent; padding: 0.55rem 0.8rem; cursor: pointer; white-space: nowrap; }
.tabs [role="tab"]:hover { color: var(--text); }
.tabs [role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.preview-bar { padding: var(--s2) var(--s4); border-top: 1px solid var(--border); background: var(--surface); }
.preview { border-top: 1px solid var(--border); }
.preview-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: 0.4rem var(--s4); font-size: 0.8rem; background: var(--surface); }
.preview-head > span:first-child { font-weight: 500; }

.repl-body { padding: var(--s3) 0; font-family: var(--mono); font-size: 0.875rem; overflow-x: auto; }
.repl-body > div { padding: 0.12rem var(--s4); white-space: pre; display: flex; gap: 0.6rem; }
.r-in code { background: none; border: 0; padding: 0; font-size: 1em; }
.r-mark { color: var(--accent); width: 0.8rem; flex: none; }
.r-out { color: var(--muted); border-bottom: 1px dashed var(--border); padding-bottom: 0.35rem !important; margin-bottom: 0.35rem; }
.r-out .r-mark { color: var(--faint); }
.r-log { padding-left: calc(var(--s4) + 1.4rem) !important; }

/* ---------- callouts, edge cases, mistakes ---------- */
.callout { display: grid; grid-template-columns: auto 1fr; gap: var(--s3); padding: var(--s3) var(--s4); margin: 0 0 var(--s5); border-radius: var(--r); border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); }
.callout > .icon { font-size: 1.1rem; margin-top: 0.2rem; color: var(--accent); }
.callout p { margin: 0; font-size: 0.94rem; }
.callout-title { font-weight: 600; margin-bottom: 0.2rem !important; }
.c-warn { border-left-color: var(--warn); } .c-warn > .icon { color: var(--warn); }
.c-danger { border-left-color: var(--err); } .c-danger > .icon { color: var(--err); }
.c-tip { border-left-color: var(--ok); } .c-tip > .icon { color: var(--ok); }

.edge, .mistake { margin: 0 0 var(--s5); padding: var(--s4); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }

.edge-row { display: grid; grid-template-columns: 9rem 1fr; gap: var(--s3); font-size: 0.93rem; }
.edge-k { color: var(--faint); font-size: 0.85rem; padding-top: 0.1rem; }
.mistake-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.mistake .bad .cb-title { color: var(--err); }
.mistake .good .cb-title { color: var(--ok); }
.mistake-why { margin: var(--s3) 0 0; font-size: 0.93rem; color: var(--muted); }

/* ---------- summary, quiz, complete ---------- */
.takeaways { list-style: none; padding: 0; margin: 0; }
.takeaways li { display: grid; grid-template-columns: 1.4rem 1fr; gap: var(--s2); padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
.takeaways .icon { color: var(--ok); margin-top: 0.3rem; }
.quiz { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: var(--s3); background: var(--surface); }
.quiz summary { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); cursor: pointer; list-style: none; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::after { content: "Show answer"; margin-left: auto; font-size: 0.78rem; color: var(--accent); white-space: nowrap; padding-top: 0.2rem; }
.quiz[open] summary::after { content: "Hide answer"; }
.quiz-n { font-family: var(--mono); font-size: 0.8rem; color: var(--faint); padding-top: 0.15rem; }
.quiz .pre { border-top: 1px solid var(--border); background: var(--code-bg); }
.quiz-a { padding: var(--s3) var(--s4); border-top: 1px solid var(--border); }
.quiz-a p { margin: 0; }
.complete-row { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; margin: var(--s6) 0; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  min-height: 42px; padding: 0 1.05rem;
  font: 500 0.93rem var(--font); color: var(--text); text-decoration: none;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r); cursor: pointer;
}
.btn:hover { border-color: var(--muted); text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s6); padding-top: var(--s5); border-top: 1px solid var(--border); }

/* ---------- home ---------- */
.home { max-width: 52rem; margin: 0 auto; }
.hero { padding: var(--s5) 0 var(--s6); border-bottom: 1px solid var(--border); margin-bottom: var(--s6); }
.hero-title { display: flex; align-items: center; gap: var(--s4); font-size: clamp(2.2rem, 1.6rem + 2.6vw, 3.4rem); letter-spacing: -0.035em; margin-bottom: var(--s3); }
.hero-mark { font-family: var(--mono); font-weight: 500; color: var(--accent); font-size: 0.7em; letter-spacing: -0.08em; }

.how { margin-bottom: var(--s6); }

.how-steps li::before { content: counter(h); display: block; font-family: var(--mono); color: var(--accent); font-size: 0.85rem; margin-bottom: var(--s1); }
.how-steps strong { color: var(--text); display: block; }
.path { list-style: none; margin: 0 0 var(--s5); padding: 0; border-top: 1px solid var(--border); }
.path-item { display: grid; grid-template-columns: 2.2rem 1fr auto 1.2rem; gap: var(--s4); align-items: baseline; padding: var(--s3) var(--s2); border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
.path-item:hover { background: var(--surface); }
.path-num { font-family: var(--mono); color: var(--accent); font-size: 0.95rem; text-align: right; }
.path-text { display: flex; flex-direction: column; }
.path-title { font-weight: 500; }
.path-short { font-size: 0.88rem; color: var(--muted); }

.tools-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-bottom: var(--s4); }
.tool-link { display: flex; gap: var(--s3); padding: var(--s4); border: 1px solid var(--border); border-radius: var(--r-lg); text-decoration: none; color: var(--text); background: var(--surface); }
.tool-link:hover { border-color: var(--accent); }
.tool-link > .icon { font-size: 1.25rem; color: var(--accent); margin-top: 0.15rem; }

/* ---------- reference ---------- */
.ref-filter { display: flex; align-items: center; gap: var(--s3); margin: var(--s4) 0 var(--s5); padding: 0 var(--s3); border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); max-width: 32rem; }

/* ---------- search dialog ---------- */
.search-dialog { width: min(640px, calc(100vw - 2rem)); max-height: min(72vh, 640px); padding: 0; margin: 10vh auto auto; border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--surface); color: var(--text); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45); overflow: hidden; }

#search-input { flex: 1; min-width: 0; height: 54px; background: none; border: 0; color: var(--text); font: inherit; font-size: 1.05rem; }
#search-input:focus { outline: none; }
#search-results { list-style: none; margin: 0; padding: var(--s2); overflow-y: auto; }
#search-results [role="option"] a { display: grid; grid-template-columns: 5.6rem 1fr; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r); text-decoration: none; color: var(--text); }
#search-results [role="option"][aria-selected="true"] a, #search-results [role="option"] a:hover { background: var(--accent-soft); }

.s-title { font-weight: 500; font-size: 0.94rem; overflow-wrap: anywhere; }

mark { background: var(--warn-soft); color: inherit; border-bottom: 1px solid var(--warn); }

/* ---------- teaching mode ---------- */
body.teaching { font-size: 1.12rem; }
body.teaching .layout { grid-template-columns: minmax(0, 1fr); }
body.teaching .sidebar, body.teaching .toc, body.teaching .progress { display: none; }
body.teaching .doc { grid-template-columns: minmax(0, 60rem); }

body.teaching .sidebar {

body.teaching .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--s2) var(--s2) var(--s3); }

/* ---------- responsive ---------- */
@media (max-width: 1279px) {
  .doc { grid-template-columns: minmax(0, var(--read)); }

}
@media (max-width: 1023px) {

  .sidebar {
    position: fixed; z-index: 50; top: 0; left: 0; bottom: 0;

    box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
  }
  .drawer-open .sidebar { transform: none; visibility: visible; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--s2) var(--s2) var(--s3); }
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 7, 10, 0.55); }
  .main { padding: var(--s5) var(--s4) var(--s7); }

}
@media (min-width: 1024px) { body:not(.teaching) .scrim { display: none !important; } }
@media (max-width: 760px) {
  .progress { display: none; }
  .header-search { width: auto; flex: 0 1 auto; }

  .brand-name { font-size: 0.95rem; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  .header, .sidebar, .toc, .pager, .complete-row, .copy, .preview-bar { display: none !important; }

}

<script>
/* JS Field Guide content. Edit lessons here; layout code lives in app.js. */
(function () {
  // d`...` keeps code exactly as typed (backslashes stay), removes common indentation.
  // Inside d`...` write \` for a backtick and \${ for a literal ${.
  function d(s) {
    let text = s.raw.join("").replace(/\\`/g, "`").replace(/\\\$\{/g, "${");
    text = text.replace(/<\\\/script/g, "<\/script").replace(/^\n/, "").replace(/\n\s*$/, "");
    const lines = text.split("\n");
    const indent = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
    return lines.map((l) => l.slice(indent)).join("\n");
  }
  const P = (html) => ({ t: "p", html });
  const L = (items) => ({ t: "list", items });
  const OL = (items) => ({ t: "steps", items });
  const C = (o) => ({ t: "code", lang: "js", env: "console", kind: "console", ...o });
  const F = (o) => ({ t: "files", env: "page", kind: "page", ...o });
  const R = (o) => ({ t: "repl", env: "repl", ...o });
  const N = (kind, title, html) => ({ t: "callout", kind, title, html });
  const E = (o) => ({ t: "edge", lang: "js", env: "console", kind: "console", ...o });
  const M = (o) => ({ t: "mistake", lang: "js", ...o });
  const T = (head, rows) => ({ t: "table", head, rows });
  const S = (id, title, blocks, extra) => ({ id, title, blocks, extra: !!extra });

  window.JSFG = { d, P, L, OL, C, F, R, N, E, M, T, S, lessons: [] };
  const lessons = window.JSFG.lessons;

  /* ------------------------------------------------------------------ */
  lessons.push({
    slug: "fundamentals",
    num: 1,
    title: "JavaScript fundamentals, variables and types",
    short: "Where JavaScript runs, how to store values, and what kinds of values exist.",
    minutes: 10,
    objectives: [
      "Connect a JavaScript file to an HTML page with <code>defer</code>",
      "Choose between <code>const</code> and <code>let</code>",
      "Recognise the primitive types and check them with <code>typeof</code>",
    ],
    sections: [
      S("what-is-js", "What JavaScript does", [
        P("HTML describes what is on the page. CSS decides how it looks. JavaScript decides what happens: it reacts to clicks, reads what people type, changes the page and talks to servers. Every modern browser has a JavaScript engine built in, so you do not need to install anything to run it."),
        T(["Layer", "Job", "Example"], [
          ["HTML", "Structure and content", "<code>&lt;button&gt;Save&lt;/button&gt;</code>"],
          ["CSS", "Appearance", "<code>button { color: white; }</code>"],
          ["JavaScript", "Behaviour", "Show a message when the button is clicked"],
        ]),
      ]),
      S("connecting", "Connecting JavaScript to a page", [
        P("You can write JavaScript inside a <code>&lt;script&gt;</code> tag in the HTML, but real projects keep it in a separate <code>.js</code> file. Separate files are easier to read, reuse and debug, because error messages point at a file name and line number."),
        F({
          title: "The setup used in every page example",
          files: [
            { name: "index.html", lang: "html", code: d`
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <title>My first script</title>
                <script src="script.js" defer><\/script>
              </head>
              <body>
                <h1>Open the console to see the message</h1>
              </body>
              </html>
            ` },
            { name: "script.js", lang: "js", code: d`
              console.log("script.js is connected!");
            ` },
          ],
          out: ["Console: script.js is connected!"],
          explain: "Put both files in the same folder, open <code>index.html</code> in the browser, then open DevTools (F12) and choose the Console tab.",
        }),
        N("tip", "Why defer?", "A script without <code>defer</code> in the <code>&lt;head&gt;</code> runs before the browser has read the body, so your code cannot find any elements yet. <code>defer</code> downloads the file straight away but waits to run it until the whole HTML document has been parsed. Use it on every external script in the head."),
        P("An inline script looks like <code>&lt;script&gt;console.log(\"hi\");&lt;/script&gt;</code>. It is fine for a two-line experiment, but <code>defer</code> has no effect on inline scripts, so place them at the end of <code>&lt;body&gt;</code> if they touch elements."),
      ]),
      S("variables", "Variables with const and let", [
        P("A variable is a name that points at a value. Use <code>const</code> by default. Switch to <code>let</code> only when the value genuinely needs to change later, such as a counter."),
        C({
          title: "Declaring and reassigning",
          code: d`
            let score = 10;
            score = 15;            // let allows reassignment
            const maxScore = 100;  // const does not
            console.log(score, maxScore);
          `,
          out: ["15 100"],
        }),
        E({
          title: "Reassigning a const",
          expect: "The name changes to \"Other\".",
          code: d`
            const siteName = "JS Field Guide";
            siteName = "Other";
          `,
          kind: "error",
          out: ["Uncaught TypeError: Assignment to constant variable."],
          why: "<code>const</code> locks the binding: the name can never point at a different value.",
          fix: "Use <code>let</code> if the value really has to change.",
        }),
        E({
          title: "A const object can still change inside",
          expect: "const makes the whole object frozen.",
          code: d`
            const user = { name: "Ada" };
            user.name = "Grace";   // changing a property, not the binding
            console.log(user);
          `,
          out: ["{name: 'Grace'}"],
          why: "<code>const</code> stops you pointing <code>user</code> at a new object. It says nothing about the contents of the object it already points at.",
          fix: "Treat <code>const</code> as “this name will not be reassigned”, not as “this data is read-only”.",
        }),
        E({
          title: "Declared but not assigned",
          expect: "An error, because there is no value.",
          code: d`
            let city;
            console.log(city);
          `,
          out: ["undefined"],
          why: "A declared variable with no value holds <code>undefined</code>. That is a normal value, not an error.",
        }),
        E({
          title: "Using a name that was never declared",
          expect: "It prints undefined, like the example above.",
          code: d`
            console.log(country);
          `,

              function getCourses(shouldFail) {

                    if (shouldFail) reject(new Error("Server unavailable"));

                  }, 1000);
                });
              }

                    return;
                  }
                  for (const course of courses) {

                    li.textContent = course;

      li.textContent = taskName;
      list.append(li);
      li.remove();
    `, "Safe way to add content that includes user input."),
    Q("Events", "Event listeners", d`
      btn.addEventListener("click", (event) => {
        console.log(event.target);
      });
      input.addEventListener("input", (e) => console.log(e.target.value));
    `, "Common events: <code>click</code>, <code>input</code>, <code>change</code>, <code>submit</code>, <code>keydown</code>.", "Attach listeners once, not inside other handlers."),
    Q("Events", "Form submission", d`
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const email = form.querySelector("#email").value.trim();
      });
    `, "Listen on the form so Enter key submissions are handled too."),
    Q("Events", "Event delegation", d`
      list.addEventListener("click", (event) => {
        const btn = event.target.closest(".delete-btn");
        if (!btn) return;
        btn.closest("li").remove();
      });
    `, "One listener on the parent covers current and future children."),
    Q("Async", "Promises", d`
      getData()
        .then((data) => console.log(data))
        .catch((error) => console.error(error))
        .finally(() => console.log("done"));
    `, "A promise is pending, then fulfilled or rejected."),
    Q("Async", "async / await", d`
      async function load() {
        try {
          const data = await getData();
          render(data);
        } catch (error) {
          showError(error.message);
        } finally {
          hideSpinner();
        }
      }
    `, "<code>await</code> works inside <code>async</code> functions.", "An async function always returns a promise."),
    Q("Async", "fetch with error checking", d`
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(\`HTTP \${response.status}\`);
      }
      const data = await response.json();
    `, "Network failures reject; HTTP errors do not.", "Always check <code>response.ok</code>."),
    Q("Async", "Timers", d`
      const id = setTimeout(() => console.log("later"), 1000);
      clearTimeout(id);
      const tick = setInterval(update, 1000);
      clearInterval(tick);
    `, "Delays are in milliseconds and are minimums, not exact."),
    Q("Data", "JSON", d`
      const text = JSON.stringify({ a: 1 });  // '{"a":1}'
      const obj = JSON.parse(text);           // { a: 1 }
    `, "Keys and strings must use double quotes.", "<code>JSON.parse</code> throws on invalid text; wrap it in <code>try</code>."),
    Q("Data", "localStorage", d`
      localStorage.setItem("theme", "dark");
      localStorage.getItem("theme");        // "dark" or null
      localStorage.removeItem("theme");
      localStorage.setItem("prefs", JSON.stringify(prefs));
    `, "Stores strings per origin, per browser.", "Can be unavailable; wrap access in <code>try...catch</code>."),
    Q("Debugging", "Console methods", d`
      console.log("value:", value);
      console.warn("Something odd");
      console.error("Failed:", error);
      console.table(arrayOfObjects);
      console.clear();
    `, "Label logs so you can find them."),
    Q("Debugging", "Errors", d`
      try {
        risky();
      } catch (error) {
        console.error(error.name, error.message);
      } finally {
        cleanUp();
      }
      throw new Error("Something specific went wrong");
      debugger; // pause here when DevTools is open
    `, "Never leave a catch block empty."),
  ];

  window.JSFG.roadmap = [
    { time: "0–10 min", topic: "JavaScript basics, variables and types", minutes: 10, slug: "fundamentals" },
    { time: "10–25 min", topic: "Operators, coercion and conditionals", minutes: 15, slug: "operators" },
    { time: "25–40 min", topic: "Loops, arrays and objects", minutes: 15, slug: "collections" },
    { time: "40–55 min", topic: "Functions, scope and references", minutes: 15, slug: "functions" },
    { time: "55–75 min", topic: "DOM manipulation and events", minutes: 20, slug: "dom" },
    { time: "75–90 min", topic: "Modern JavaScript", minutes: 15, slug: "modern" },
    { time: "90–105 min", topic: "Async JavaScript, promises and fetch", minutes: 15, slug: "async" },
    { time: "105–110 min", topic: "Errors, security and debugging", minutes: 5, slug: "debugging" },
    { time: "110–120 min", topic: "Questions, recap and console practice", minutes: 10, slug: "console" },
  ];
})();

</script>
<script>
(function () {
  "use strict";
  const J = window.JSFG;
  const LESSONS = J.lessons;
  const GUIDE = J.consoleGuide;
  const DOCS = [...LESSONS, GUIDE];
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  /* ---------- storage (fails quietly into memory) ---------- */
  const mem = {};
  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) {
        return key in mem ? mem[key] : fallback;
      }
    },
    set(key, value) {
      mem[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage blocked: kept in memory for this visit */ }
    },
  };

  /* ---------- icons (Lucide-style strokes) ---------- */
  const ICON_PATHS = {
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    play: '<path d="m7 4 13 8-13 8z"/>',
    reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    octagon: '<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v4M12 16h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/>',
    terminal: '<path d="m4 17 6-6-6-6M12 19h8"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    present: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
    done: '<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
    circle: '<circle cx="12" cy="12" r="10"/>',
    hash: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  };
  const icon = (name, cls = "") => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICON_PATHS[name]}</svg>`;
  window.JSFG_ICON = icon;

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const strip = (html) => String(html).replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/&quot;/g, '"');
  const slugify = (s) => strip(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  /* ---------- syntax highlighting ---------- */
  const RULES = {
    js: [
      ["com", /\/\/[^\n]*|\/\*[\s\S]*?\*\//y],
      ["str", /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`/y],
      ["num", /\b\d+(?:\.\d+)?\b/y],
      ["kw", /\b(?:const|let|var|function|return|if|else|for|while|of|in|switch|case|break|default|new|async|await|try|catch|finally|throw|typeof|instanceof|delete|import|export|from|class|this|debugger)\b/y],
      ["lit", /\b(?:true|false|null|undefined|NaN|Infinity)\b/y],
      ["fn", /[A-Za-z_$][\w$]*(?=\s*\()/y],
      ["id", /[A-Za-z_$][\w$]*/y],
      ["op", /=>|[{}()[\];,.]/y],
    ],
    html: [
      ["com", /<\!--[\s\S]*?-->/y],
      ["kw", /<!DOCTYPE[^>]*>/iy],
      ["tag", /<\/?[\w-]+/y],
      ["attr", /[\w-]+(?==)/y],
      ["str", /"[^"]*"|'[^']*'/y],
      ["tag", /\/?>/y],
    ],
    css: [
      ["com", /\/\*[\s\S]*?\*\//y],
      ["tag", /[.#]?[\w-]+(?:[.#:][\w-]+)*(?=[^{};]*\{)/y],
      ["attr", /[\w-]+(?=\s*:)/y],
      ["num", /#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|rem|em|%|vh|vw)?/y],
      ["str", /"[^"]*"|'[^']*'/y],
    ],
  };
  function highlightLines(code, lang) {
    const rules = RULES[lang];
    const lines = [[]];
    const push = (text, cls) => {
      text.split("\n").forEach((part, i) => {
        if (i > 0) lines.push([]);
        if (part) lines[lines.length - 1].push(cls ? `<span class="t-${cls}">${esc(part)}</span>` : esc(part));
      });
    };
    if (!rules) { push(code); return lines.map((l) => l.join("")); }
    let i = 0, plain = "";
    outer: while (i < code.length) {
      for (const [cls, re] of rules) {
        re.lastIndex = i;
        const m = re.exec(code);
        if (m && m[0].length) {
          if (plain) { push(plain); plain = ""; }
          push(m[0], cls === "id" ? "" : cls);
          i += m[0].length;
          continue outer;
        }
      }
      plain += code[i++];
    }
    if (plain) push(plain);
    return lines.map((l) => l.join(""));
  }

  /* ---------- code store for copy / preview ---------- */
  const CODE = [];
  const keep = (text) => CODE.push(text) - 1;

  const ENV = {
    console: ["terminal", "Console or script.js"],
    storage: ["terminal", "Browser console or a page"],
    repl: ["terminal", "Console, one line at a time"],
    "repl-note": ["terminal", "Browser console"],
    page: ["file", "Page with matching HTML"],
    module: ["file", "Module page on a local server"],
    network: ["globe", "Browser with internet"],
    none: null,
  };
  const envChip = (env) => {
    const e = ENV[env];
    return e ? `<span class="env" title="Where to run this">${icon(e[0])}${e[1]}</span>` : "";
  };
  const copyBtn = (id, label = "Copy") =>
    `<button class="btn-ghost copy" type="button" data-copy="${id}" aria-label="${esc(label)}">${icon("copy")}<span>Copy</span></button>`;

  function pre(code, lang, { hl = [], numbered = false } = {}) {
    const lines = highlightLines(code, lang);
    const body = lines.map((l, i) => `<span class="ln${hl.includes(i + 1) ? " hl" : ""}">${l || " "}</span>`).join("");
    return `<pre class="pre${numbered ? " numbered" : ""}" tabindex="0"><code class="lang-${lang}">${body}</code></pre>`;
  }

  function outputPanel(out, kind) {
    if (!out || !out.length) return "";
    const labels = { console: ["terminal", "Console output"], error: ["octagon", "Console shows an error"], page: ["eye", "On the page"] };
    const [ic, label] = labels[kind] || labels.console;
    let rows;
    if (kind === "page") {
      rows = out.map((o) => `<p class="out-text">${o}</p>`).join("");
    } else {
      rows = out.map((o) => {
        if (typeof o === "object" && o.table) {
          const t = o.table;
          return `<div class="out-table-wrap"><table class="out-table"><thead><tr>${t.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        }
        let cls = "", ic2 = "", text = o;
        if (o.startsWith("!warn ")) { cls = "warn"; text = o.slice(6); ic2 = icon("alert"); }
        else if (o.startsWith("!error ")) { cls = "err"; text = o.slice(7); ic2 = icon("octagon"); }
        else if (o.startsWith("Uncaught")) { cls = "err"; ic2 = icon("octagon"); }
        const sr = cls === "warn" ? '<span class="sr">Warning: </span>' : cls === "err" ? '<span class="sr">Error: </span>' : "";
        return `<div class="out-line ${cls}">${ic2}${sr}<span>${esc(text)}</span></div>`;
      }).join("");
    }
    return `<div class="output out-${kind}"><div class="out-head">${icon(ic)}${label}</div><div class="out-body">${rows}</div></div>`;
  }

  function lineNotes(lines) {
    if (!lines || !lines.length) return "";
    return `<dl class="line-notes">${lines.map(([n, t]) => `<div><dt>Line ${n}</dt><dd>${t}</dd></div>`).join("")}</dl>`;
  }

  function codeBlock(b) {
    const id = keep(b.code);
    const numbered = !!(b.lines && b.lines.length) || b.code.split("\n").length > 8;
    return `<figure class="code-block">
      <figcaption class="cb-head"><span class="cb-title">${esc(b.title || "")}</span><span class="cb-tools">${envChip(b.env)}${copyBtn(id, "Copy code: " + (b.title || ""))}</span></figcaption>
      ${pre(b.code, b.lang, { hl: b.hl || [], numbered })}
      ${outputPanel(b.out, b.kind)}
      ${b.explain ? `<p class="cb-explain">${b.explain}</p>` : ""}
      ${lineNotes(b.lines)}
    </figure>`;
  }

  let fileGroup = 0;
  function buildSrcdoc(files) {
    let html = (files.find((f) => f.lang === "html") || {}).code || "";
    const css = files.filter((f) => f.lang === "css").map((f) => f.code).join("\n");
    const js = files.filter((f) => f.lang === "js").map((f) => f.code).join("\n");
    html = html.replace(/<link[^>]*rel="stylesheet"[^>]*>/, `<style>${css}</style>`);
    html = html.replace(/<script[^>]*src="[^"]+"[^>]*><\/script>/g, "");
    html = html.replace("</body>", `<script>${js}<\/script>\n</body>`);
    return html;
  }
  function filesBlock(b) {
    const g = ++fileGroup;
    const tabs = b.files.map((f, i) => `<button role="tab" type="button" id="ft-${g}-${i}" aria-controls="fp-${g}-${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-copy-id="${keep(f.code)}">${esc(f.name)}</button>`).join("");
    const panels = b.files.map((f, i) => {
      const hl = (b.hl && b.hl[f.name]) || [];
      return `<div role="tabpanel" id="fp-${g}-${i}" aria-labelledby="ft-${g}-${i}"${i === 0 ? "" : " hidden"}>${pre(f.code, f.lang, { hl, numbered: true })}</div>`;
    }).join("");
    const previewId = b.preview ? keep(buildSrcdoc(b.files)) : null;
    const notesFile = b.files.find((f) => f.lang === "js");
    return `<figure class="code-block files">
      <figcaption class="cb-head"><span class="cb-title">${esc(b.title || "")}</span><span class="cb-tools">${envChip(b.env)}
        <button class="btn-ghost copy" type="button" data-copy-active="${g}" aria-label="Copy the selected file">${icon("copy")}<span>Copy</span></button></span></figcaption>
      <div class="tabs" role="tablist" aria-label="Files">${tabs}</div>
      ${panels}
      ${previewId !== null ? `<div class="preview-bar"><button class="btn-ghost" type="button" data-preview="${previewId}" aria-expanded="false">${icon("play")}<span>Show live result</span></button></div><div class="preview" hidden></div>` : ""}
      ${outputPanel(b.out, b.kind)}
      ${b.explain ? `<p class="cb-explain">${b.explain}</p>` : ""}
      ${b.lines ? `<p class="line-notes-label">Notes on ${esc(notesFile ? notesFile.name : "the code")}</p>` + lineNotes(b.lines) : ""}
    </figure>`;
  }

  function replBlock(b) {
    const id = keep(b.lines.map((l) => l.in).join("\n"));
    const rows = b.lines.map((l) => {
      const outs = l.out.slice(0, -1).map((o) => `<div class="r-log">${esc(o)}</div>`).join("");
      return `<div class="r-in"><span class="r-mark" aria-hidden="true">›</span><code>${highlightLines(l.in, "js")[0]}</code></div>${outs}<div class="r-out"><span class="r-mark" aria-hidden="true">‹</span><span class="sr">Result: </span>${esc(l.out[l.out.length - 1])}</div>`;
    }).join("");
    return `<figure class="code-block repl">
      <figcaption class="cb-head"><span class="cb-title">${esc(b.title)}</span><span class="cb-tools">${envChip("repl")}${copyBtn(id, "Copy all inputs")}</span></figcaption>
      <div class="repl-body" tabindex="0">${rows}</div>
      <p class="cb-explain">Lines starting with › are what you type. Lines with ‹ are the value the Console returns. Other lines are printed output.</p>
    </figure>`;
  }

  function calloutBlock(b) {
    const map = { tip: ["bulb", "Tip"], warn: ["alert", "Watch out"], danger: ["octagon", "Important"], note: ["info", "Note"] };
    const [ic, word] = map[b.kind] || map.note;
    return `<aside class="callout c-${b.kind}" aria-label="${word}">${icon(ic)}<div><p class="callout-title">${b.title}</p><p>${b.html}</p></div></aside>`;
  }

  function edgeBlock(b) {
    const id = keep(b.code);
    return `<div class="edge" id="${slugify("edge-" + b.title)}">
      <p class="edge-title">${icon("alert")}<span>Edge case: ${b.title}</span></p>
      <div class="edge-grid">
        <div class="edge-row"><span class="edge-k">You might expect</span><span class="edge-v">${b.expect}</span></div>
      </div>
      <figure class="code-block flat">
        <figcaption class="cb-head"><span class="cb-title">Example</span><span class="cb-tools">${envChip(b.env)}${copyBtn(id, "Copy edge case code")}</span></figcaption>
        ${pre(b.code, b.lang)}
        ${outputPanel(b.out, b.kind)}
      </figure>
      <div class="edge-grid">
        <div class="edge-row"><span class="edge-k">Why</span><span class="edge-v">${b.why}</span></div>
        ${b.fix ? `<div class="edge-row"><span class="edge-k">Do this instead</span><span class="edge-v">${b.fix}</span></div>` : ""}
      </div>
    </div>`;
  }

  function mistakeBlock(b) {
    const w = keep(b.wrong), r = keep(b.right);
    return `<div class="mistake" id="${slugify("mistake-" + b.title)}">
      <p class="edge-title">${icon("octagon")}<span>Common mistake: ${b.title}</span></p>
      <div class="mistake-pair">
        <figure class="code-block flat bad"><figcaption class="cb-head"><span class="cb-title">${icon("x")}Broken</span><span class="cb-tools">${copyBtn(w, "Copy broken version")}</span></figcaption>${pre(b.wrong, b.lang)}</figure>
        <figure class="code-block flat good"><figcaption class="cb-head"><span class="cb-title">${icon("check")}Fixed</span><span class="cb-tools">${copyBtn(r, "Copy fixed version")}</span></figcaption>${pre(b.right, b.lang)}</figure>
      </div>
      <p class="mistake-why">${b.why}</p>
    </div>`;
  }

  function tableBlock(b) {
    return `<div class="table-wrap" tabindex="0"><table><thead><tr>${b.head.map((h) => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }

  function block(b) {
    switch (b.t) {
      case "p": return `<p>${b.html}</p>`;
      case "list": return `<ul class="prose-list">${b.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
      case "steps": return `<ol class="steps">${b.items.map((i) => `<li>${i}</li>`).join("")}</ol>`;
      case "code": return codeBlock(b);
      case "files": return filesBlock(b);
      case "repl": return replBlock(b);
      case "callout": return calloutBlock(b);
      case "edge": return edgeBlock(b);
      case "mistake": return mistakeBlock(b);
      case "table": return tableBlock(b);
      default: return "";
    }
  }

  /* ---------- progress ---------- */
  const getDone = () => new Set(store.get("jsfg-progress", []));
  function setDone(slug, on) {
    const done = getDone();
    on ? done.add(slug) : done.delete(slug);
    store.set("jsfg-progress", [...done]);
    updateProgress();
  }
  function updateProgress() {
    const done = getDone();
    const n = LESSONS.filter((l) => done.has(l.slug)).length;
    const el = $("#progress");
    el.querySelector(".progress-text").textContent = `${n} of ${LESSONS.length} lessons`;
    el.querySelector(".progress-fill").style.width = `${(n / LESSONS.length) * 100}%`;
    el.setAttribute("aria-label", `Progress: ${n} of ${LESSONS.length} lessons completed`);
    $$("[data-done-mark]").forEach((m) => {
      const isDone = done.has(m.dataset.doneMark);
      m.classList.toggle("is-done", isDone);
      m.innerHTML = icon(isDone ? "done" : "circle");
      m.setAttribute("aria-label", isDone ? "Completed" : "Not completed");
    });
  }

  /* ---------- sidebar ---------- */
  function renderSidebar() {
    const lessonLinks = LESSONS.map((l) => `<li><a href="#/learn/${l.slug}" data-nav="learn/${l.slug}"><span class="nav-num">${l.num}</span><span class="nav-label">${esc(l.title)}</span><span class="nav-done" data-done-mark="${l.slug}" role="img"></span></a></li>`).join("");
    $("#sidebar-nav").innerHTML = `
      <p class="nav-group">Start here</p>
      <ul><li><a href="#/" data-nav="">${icon("book")}<span class="nav-label">Overview</span></a></li>

  function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    let key, html, title, target = null, base = "";
    const prevCode = CODE.slice();
    CODE.length = 0;
    if (!parts.length) { key = ""; html = homePage(); title = "JS Field Guide"; }
    else if (parts[0] === "learn" && LESSONS.find((l) => l.slug === parts[1])) {

      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");

      window.scrollTo(0, 0);
      const h = $("#page-title");
      if (h && document.activeElement !== $("#search-input")) h.focus({ preventScroll: true });
    }
  }

  function setupToc() {
    if (tocObserver) tocObserver.disconnect();
    const links = $$("[data-toc]");
    if (!links.length || !("IntersectionObserver" in window)) return;
    const visible = new Map();
    tocObserver = new IntersectionObserver((entries) => {
      entries.forEach((e) => visible.set(e.target.id, e.isIntersecting));
      const first = links.find((a) => visible.get(a.dataset.toc));
      if (first) links.forEach((a) => a.classList.toggle("active", a === first));
    }, { rootMargin: "-70px 0px -60% 0px" });
    links.forEach((a) => { const h = document.getElementById(a.dataset.toc); if (h) tocObserver.observe(h); });
  }

  function setupRefFilter() {
    const input = $("#ref-q");
    if (!input) return;
    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      $$(".ref-entry").forEach((e) => { const on = !q || e.dataset.refText.includes(q); e.hidden = !on; if (on) shown++; });
      $$(".ref-group").forEach((g) => { g.hidden = !$$(".ref-entry", g).some((e) => !e.hidden); });
      $(".ref-empty").hidden = shown > 0;
      $("#ref-count").textContent = q ? `${shown} ${shown === 1 ? "entry" : "entries"}` : "";
    });
  }

  /* ---------- search ---------- */
  const INDEX = [];
  function buildIndex() {
    const add = (title, ctx, href, type, extra = "") => INDEX.push({ title: strip(title), ctx: strip(ctx), href, type, hay: (strip(title) + " " + strip(ctx) + " " + extra).toLowerCase() });
    DOCS.forEach((doc) => {
      const base = doc.num ? `#/learn/${doc.slug}` : `#/${doc.slug}`;
      const where = doc.num ? `Lesson ${doc.num}` : "Console guide";
      add(doc.title, `${where}: ${doc.short}`, base, doc.num ? "Lesson" : "Guide");
      doc.sections.forEach((s) => {
        const text = s.blocks.map((b) => [b.html, b.title, b.code, b.explain, b.why].filter(Boolean).join(" ")).join(" ");
        add(s.title, `${where}: ${doc.title}`, `${base}/${s.id}`, "Section", strip(text).slice(0, 3000));
        s.blocks.forEach((b) => {
          if (b.t === "code" || b.t === "files" || b.t === "repl") add(b.title, `Example in ${where}, ${s.title}`, `${base}/${s.id}`, "Example", (b.code || "") + " " + (b.out || []).filter((o) => typeof o === "string").join(" "));
          if (b.t === "edge") add(b.title, `Edge case in ${where}, ${s.title}`, `${base}/${slugify("edge-" + b.title)}`, "Edge case", b.code + " " + (b.out || []).join(" ") + " " + b.why);
          if (b.t === "mistake") add(b.title, `Common mistake in ${where}`, `${base}/${slugify("mistake-" + b.title)}`, "Mistake", b.wrong + " " + b.why);
          if (b.out) b.out.forEach((o) => { if (typeof o === "string" && /Uncaught|!error/.test(o)) add(o.replace(/^!error /, "").replace(/\s+script\.js:\d+$/, ""), `Error explained in ${where}, ${s.title}`, `${base}/${s.id}`, "Error"); });
        });
      });
    });
    J.reference.forEach((r) => add(r.name, `Quick reference: ${r.group}. ${strip(r.note)}`, `#/reference/${slugify(r.name)}`, "Reference", r.code));
    add("Workshop roadmap", "Timings for the two-hour session", "#/roadmap", "Page");
    const seen = new Set();
    for (let i = INDEX.length - 1; i >= 0; i--) { const k = INDEX[i].title + INDEX[i].href; if (seen.has(k)) INDEX.splice(i, 1); else seen.add(k); }
  }
  function search(q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    const rank = { Lesson: 0, Guide: 0, Section: 1, Reference: 2, Example: 3, "Edge case": 3, Mistake: 3, Error: 2, Page: 1 };
    return INDEX.filter((e) => words.every((w) => e.hay.includes(w)))
      .map((e) => {
        const t = e.title.toLowerCase();
        let score = rank[e.type] ?? 4;
        if (words.every((w) => t.includes(w))) score -= 5;
        if (t.startsWith(words[0])) score -= 1;
        return { e, score };
      })
      .sort((a, b) => a.score - b.score)
      .slice(0, 40)
      .map((x) => x.e);
  }
  const dialog = $("#search-dialog");
  const sInput = $("#search-input");
  const sList = $("#search-results");
  let sActive = -1, sItems = [];
  function mark(text, words) {
    let html = esc(text);
    words.forEach((w) => { if (w.length > 1) html = html.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"), "<mark>$1</mark>"); });
    return html;
  }
  function renderResults() {
    const q = sInput.value.trim();
    sItems = search(q);
    sActive = sItems.length ? 0 : -1;
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!q) {
      sList.innerHTML = `<li class="s-empty">Search lessons, examples, errors and syntax. Try <button type="button" class="linkish" data-try="querySelector">querySelector</button>, <button type="button" class="linkish" data-try="null">null</button> or <button type="button" class="linkish" data-try="fetch">fetch</button>.</li>`;
    } else if (!sItems.length) {
      sList.innerHTML = `<li class="s-empty">No results for “${esc(q)}”. Try a single keyword such as an error word or a method name.</li>`;
    } else {
      sList.innerHTML = sItems.map((e, i) => `<li role="option" id="sr-${i}" aria-selected="${i === sActive}"><a href="${e.href}" tabindex="-1"><span class="s-type">${e.type}</span><span class="s-text"><span class="s-title">${mark(e.title, words)}</span><span class="s-ctx">${esc(e.ctx)}</span></span></a></li>`).join("");
    }
    sInput.setAttribute("aria-activedescendant", sActive >= 0 ? `sr-${sActive}` : "");
    $("#search-status").textContent = q ? `${sItems.length} result${sItems.length === 1 ? "" : "s"}` : "";
  }
  function moveActive(d) {
    if (!sItems.length) return;
    sActive = (sActive + d + sItems.length) % sItems.length;
    $$('[role="option"]', sList).forEach((li, i) => li.setAttribute("aria-selected", i === sActive));
    sInput.setAttribute("aria-activedescendant", `sr-${sActive}`);
    const li = $(`#sr-${sActive}`);
    if (li) li.scrollIntoView({ block: "nearest" });
  }
  function openSearch() {
    if (dialog.open) return;
    lastFocus = document.activeElement;
    lastHashOnOpen = location.hash;
    if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
    sInput.select();
    renderResults();
  }
  let lastFocus = null;
  function closeSearch() {
    if (dialog.open) dialog.close();
  }
  dialog.addEventListener("close", () => {
    if (location.hash === lastHashOnOpen && lastFocus && document.contains(lastFocus)) lastFocus.focus();
  });
  let lastHashOnOpen = "";
  sInput.addEventListener("input", renderResults);
  sInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeSearch(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
    else if (e.key === "Enter" && sActive >= 0) { e.preventDefault(); location.hash = sItems[sActive].href; closeSearch(); }
  });
  sList.addEventListener("click", (e) => {
    const t = e.target.closest("[data-try]");
    if (t) { sInput.value = t.dataset.try; renderResults(); sInput.focus(); return; }
    if (e.target.closest("a")) closeSearch();
  });
  dialog.addEventListener("click", (e) => { if (e.target === dialog) closeSearch(); });
  $("#search-close").addEventListener("click", closeSearch);
  $("#search-open").addEventListener("click", openSearch);

  /* ---------- copy ---------- */
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      ta.remove();
      return ok;
    }
  }
  function announce(msg) { const live = $("#live"); live.textContent = ""; setTimeout(() => (live.textContent = msg), 30); }
  async function handleCopy(btn, text) {
    const ok = await copyText(text);
    const label = btn.querySelector("span");
    btn.classList.add(ok ? "copied" : "copy-failed");
    label.textContent = ok ? "Copied" : "Copy failed";
    btn.querySelector(".icon").outerHTML = icon(ok ? "check" : "x");
    announce(ok ? "Code copied to clipboard" : "Copy failed. Select the code and press Ctrl+C.");
    clearTimeout(btn._t);
    btn._t = setTimeout(() => {
      btn.classList.remove("copied", "copy-failed");
      label.textContent = "Copy";
      btn.querySelector(".icon").outerHTML = icon("copy");
    }, 1800);
  }

  /* ---------- global clicks ---------- */
  document.addEventListener("click", (e) => {
    const copy = e.target.closest("[data-copy]");
    if (copy) { handleCopy(copy, CODE[+copy.dataset.copy]); return; }
    const copyActive = e.target.closest("[data-copy-active]");
    if (copyActive) {
      const fig = copyActive.closest(".files");
      const tab = $('[role="tab"][aria-selected="true"]', fig);
      handleCopy(copyActive, CODE[+tab.dataset.copyId]);
      return;
    }
    const tab = e.target.closest('[role="tab"]');
    if (tab) { selectTab(tab); return; }
    const prev = e.target.closest("[data-preview]");
    if (prev) { togglePreview(prev); return; }
    const reset = e.target.closest("[data-preview-reset]");
    if (reset) { const frame = reset.closest(".preview").querySelector("iframe"); frame.srcdoc = CODE[+reset.dataset.previewReset]; return; }
    const complete = e.target.closest("[data-complete]");
    if (complete) {
      const slug = complete.dataset.complete;
      const now = !getDone().has(slug);
      setDone(slug, now);
      complete.setAttribute("aria-pressed", now);
      complete.className = `btn ${now ? "btn-done" : "btn-primary"}`;
      complete.innerHTML = `${icon(now ? "done" : "check")}<span>${now ? "Completed" : "Mark lesson complete"}</span>`;
      announce(now ? "Lesson marked complete" : "Lesson marked not complete");
    }
  });

  function selectTab(tab) {
    const list = tab.closest('[role="tablist"]');
    const fig = tab.closest(".files");
    $$('[role="tab"]', list).forEach((t) => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      $("#" + t.getAttribute("aria-controls"), fig).hidden = !on;
    });
  }
  document.addEventListener("keydown", (e) => {
    const tab = e.target.closest && e.target.closest('[role="tab"]');
    if (!tab || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    const tabs = $$('[role="tab"]', tab.parentElement);
    let i = tabs.indexOf(tab);
    i = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault();
    tabs[i].focus();
    selectTab(tabs[i]);
  });

  function togglePreview(btn) {
    const box = btn.closest(".preview-bar").nextElementSibling;
    const open = box.hidden;
    box.hidden = !open;
    btn.setAttribute("aria-expanded", open);
    btn.querySelector("span").textContent = open ? "Hide live result" : "Show live result";
    if (open && !box.firstChild) {
      const id = btn.dataset.preview;
      box.innerHTML = `<div class="preview-head"><span>Live result</span><span class="muted small">Errors from this preview appear in your DevTools console.</span><button class="btn-ghost" type="button" data-preview-reset="${id}">${icon("reset")}<span>Reload</span></button></div><iframe title="Live result of the example" sandbox="allow-scripts allow-modals allow-forms" loading="lazy"></iframe>`;
      box.querySelector("iframe").srcdoc = CODE[+id];
    }
  }

  /* ---------- theme, teaching mode, drawer ---------- */
  const root = document.documentElement;
  function applyTheme(t) {
    root.dataset.theme = t;
    const btn = $("#theme-toggle");
    btn.innerHTML = icon(t === "dark" ? "sun" : "moon");
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
    $('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0B0D12" : "#F7F8FA");
  }
  $("#theme-toggle").addEventListener("click", () => {
    const t = root.dataset.theme === "dark" ? "light" : "dark";
    store.set("jsfg-theme", t);
    applyTheme(t);
  });
  function applyTeach(on) {
    document.body.classList.toggle("teaching", on);
    const b = $("#teach-toggle");
    b.setAttribute("aria-pressed", on);
    b.setAttribute("aria-label", on ? "Turn off teaching mode" : "Turn on teaching mode");
    b.title = on ? "Teaching mode on" : "Teaching mode";
    closeDrawer();
    syncInert();
  }
  $("#teach-toggle").addEventListener("click", () => {
    const on = !document.body.classList.contains("teaching");
    store.set("jsfg-teach", on);
    applyTeach(on);
  });

  const drawerBtn = $("#menu-toggle");
  function openDrawer() {
    document.body.classList.add("drawer-open");
    $("#scrim").hidden = false;
    drawerBtn.setAttribute("aria-expanded", "true");
    $("#sidebar").removeAttribute("inert");
    const a = $("#sidebar a.active") || $("#sidebar a");
    if (a) a.focus();
  }
  function closeDrawer() {
    if (!document.body.classList.contains("drawer-open")) return;
    document.body.classList.remove("drawer-open");
    $("#scrim").hidden = true;
    drawerBtn.setAttribute("aria-expanded", "false");
    syncInert();
  }
  const mq = window.matchMedia("(max-width: 1023px)");
  function syncInert() {
    const sb = $("#sidebar");
    const drawerMode = mq.matches || document.body.classList.contains("teaching");
    if (drawerMode && !document.body.classList.contains("drawer-open")) sb.setAttribute("inert", ""); else sb.removeAttribute("inert");
  }
  mq.addEventListener ? mq.addEventListener("change", () => { closeDrawer(); syncInert(); }) : mq.addListener(syncInert);
  drawerBtn.addEventListener("click", () => (document.body.classList.contains("drawer-open") ? (closeDrawer(), drawerBtn.focus()) : openDrawer()));
  $("#scrim").addEventListener("click", () => { closeDrawer(); drawerBtn.focus(); });
  $("#drawer-close").addEventListener("click", () => { closeDrawer(); drawerBtn.focus(); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.body.classList.contains("drawer-open")) { closeDrawer(); drawerBtn.focus(); return; }
    const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable='true']");
    if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); return; }
    if (e.key === "/" && !typing && !dialog.open) { e.preventDefault(); openSearch(); }
  });

  /* ---------- start ---------- */
  applyTheme(store.get("jsfg-theme", "dark"));
  applyTeach(store.get("jsfg-teach", false));
  $("#search-kbd").textContent = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘K" : "Ctrl K";
  renderSidebar();
  buildIndex();
  syncInert();
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
